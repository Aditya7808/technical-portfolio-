<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" height="auto">
  <defs>
    <style>
      .main-title { font-family: 'Newsreader', Georgia, serif; font-size: 24px; font-weight: 700; fill: #1C1917; letter-spacing: 0.05em; }
      .pill-text { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
      .annot-text { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; fill: #57534E; line-height: 1.45; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1C1917"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2A9D8F"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FAF6F0" rx="12" stroke="#E6DFD5" stroke-width="2"/>

  <!-- Main Title -->
  <text x="550" y="52" class="main-title" text-anchor="middle">Matching Resumes to Jobs · Dual Hybrid Search</text>

  <!-- ========================================================
       TOP STREAM: RESUME &amp; COMPETENCIES
       ======================================================== -->
  <!-- Long bypass arrow from Resume directly to Embedding Model -->
  <path d="M 180 145 L 180 85 L 685 85 L 685 130" fill="none" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- Resume Pill -->
  <rect x="120" y="145" width="120" height="52" rx="14" fill="#38A3A5"/>
  <text x="180" y="176" class="pill-text" text-anchor="middle">Resume</text>

  <!-- Arrow Resume -> LLM -->
  <line x1="240" y1="171" x2="285" y2="171" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- LLM 1 Pill -->
  <rect x="295" y="145" width="100" height="52" rx="14" fill="#38A3A5"/>
  <text x="345" y="176" class="pill-text" text-anchor="middle">LLM</text>

  <!-- Arrow LLM -> Core Competencies -->
  <line x1="395" y1="171" x2="445" y2="171" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- Core Competencies Pill -->
  <rect x="455" y="145" width="130" height="52" rx="14" fill="#38A3A5"/>
  <text x="520" y="169" class="pill-text" text-anchor="middle">Core</text>
  <text x="520" y="185" class="pill-text" text-anchor="middle">Competencies</text>

  <!-- Annotation under LLM 1 -->
  <text x="345" y="215" class="annot-text" text-anchor="middle">LLM extracts set of core</text>
  <text x="345" y="230" class="annot-text" text-anchor="middle">competencies from a resume</text>

  <!-- Arrow Core Competencies -> Embedding Model -->
  <line x1="585" y1="171" x2="625" y2="171" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- Top Embedding Model -->
  <rect x="635" y="140" width="105" height="58" rx="14" fill="#E76F51"/>
  <text x="687" y="166" class="pill-text" text-anchor="middle">Embedding</text>
  <text x="687" y="184" class="pill-text" text-anchor="middle">Model</text>

  <!-- Branching Arrows from Top Embedding Model -->
  <path d="M 660 198 L 575 228" fill="none" stroke="#1C1917" stroke-width="2.5" marker-end="url(#arr-gray)"/>
  <path d="M 715 198 L 730 228" fill="none" stroke="#1C1917" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Resume Embedding Box -->
  <rect x="520" y="235" width="115" height="52" rx="12" fill="#457B9D"/>
  <text x="577" y="259" class="pill-text" text-anchor="middle">Resume</text>
  <text x="577" y="275" class="pill-text" text-anchor="middle">Embedding</text>

  <!-- Competency Embedding Box -->
  <rect x="690" y="235" width="125" height="52" rx="12" fill="#457B9D"/>
  <text x="752" y="259" class="pill-text" text-anchor="middle">Competency</text>
  <text x="752" y="275" class="pill-text" text-anchor="middle">Embedding</text>

  <!-- Right Annotation: Stored in Elastic -->
  <text x="830" y="156" class="annot-text">The Resume is embedded, as</text>
  <text x="830" y="172" class="annot-text">well as the core competencies.</text>
  <text x="830" y="188" class="annot-text">Both are stored in Elastic</text>
  <text x="830" y="204" class="annot-text">separately</text>

  <!-- ========================================================
       CENTER MULTI-VECTOR / ELASTICSEARCH HYBRID CLUSTER
       ======================================================== -->
  <g transform="translate(620, 310)">
    <!-- Central decorative petal cluster -->
    <path d="M 40 40 C 25 10, 60 10, 50 35 Z" fill="#E76F51"/>
    <path d="M 25 35 C 10 20, 10 55, 30 50 Z" fill="#2A9D8F"/>
    <path d="M 35 55 C 20 70, 55 75, 45 55 Z" fill="#E9C46A"/>
    <path d="M 50 50 C 65 65, 75 35, 55 40 Z" fill="#264653"/>
    <circle cx="45" cy="45" r="28" fill="#F4A261" opacity="0.9"/>
    <circle cx="45" cy="45" r="16" fill="#FFFFFF"/>
    <text x="45" y="49" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#1C1917" text-anchor="middle">ELASTIC</text>
  </g>

  <!-- Double-headed vertical matching arrows -->
  <line x1="577" y1="292" x2="577" y2="400" stroke="#1C1917" stroke-width="2.5" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <line x1="752" y1="292" x2="752" y2="400" stroke="#1C1917" stroke-width="2.5" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>

  <!-- Right Annotation: Double Hybrid Search -->
  <text x="825" y="270" class="annot-text">Resume is matched with</text>
  <text x="825" y="286" class="annot-text">ideal resumes. Competency</text>
  <text x="825" y="302" class="annot-text">matched with requirements.</text>
  <text x="825" y="318" class="annot-text">A double hybrid search is</text>
  <text x="825" y="334" class="annot-text">performed</text>

  <!-- Job Matches Output Arrow -->
  <line x1="730" y1="360" x2="775" y2="360" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- Job Matches Box -->
  <rect x="785" y="335" width="130" height="50" rx="12" fill="#2B5B84"/>
  <text x="850" y="365" class="pill-text" text-anchor="middle">Job Matches</text>

  <!-- ========================================================
       BOTTOM STREAM: JOB DESCRIPTIONS &amp; REQUIREMENTS
       ======================================================== -->
  <!-- Job Descriptions Box -->
  <rect x="225" y="435" width="135" height="52" rx="14" fill="#457B9D"/>
  <text x="292" y="466" class="pill-text" text-anchor="middle">Job Descriptions</text>

  <!-- Arrow Job Descriptions -> LLM 2 -->
  <line x1="360" y1="461" x2="405" y2="461" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- LLM 2 Pill -->
  <rect x="415" y="435" width="100" height="52" rx="14" fill="#38A3A5"/>
  <text x="465" y="466" class="pill-text" text-anchor="middle">LLM</text>

  <!-- Annotation above/left LLM 2 -->
  <text x="350" y="398" class="annot-text" text-anchor="middle">The LLM extracts a set of core</text>
  <text x="350" y="413" class="annot-text" text-anchor="middle">requirements from a job</text>
  <text x="350" y="428" class="annot-text" text-anchor="middle">description. It also creates an</text>
  <text x="350" y="443" class="annot-text" text-anchor="middle">ideal candidate's resume</text>

  <!-- Branching Arrows from LLM 2 -->
  <path d="M 515 450 L 545 450" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>
  <path d="M 515 470 L 675 470" stroke="#1C1917" stroke-width="3" marker-end="url(#arr-gray)"/>

  <!-- Ideal Candidate Resume Box -->
  <rect x="555" y="435" width="135" height="52" rx="14" fill="#38A3A5"/>
  <text x="622" y="458" class="pill-text" text-anchor="middle">Ideal Candidate</text>
  <text x="622" y="474" class="pill-text" text-anchor="middle">Resume</text>

  <!-- Core Requirements Box -->
  <rect x="705" y="435" width="130" height="52" rx="14" fill="#38A3A5"/>
  <text x="770" y="458" class="pill-text" text-anchor="middle">Core</text>
  <text x="770" y="474" class="pill-text" text-anchor="middle">Requirements</text>

  <!-- Arrows from Ideal Candidate / Core Requirements to Bottom Embedding Model -->
  <path d="M 622 487 L 670 515" fill="none" stroke="#1C1917" stroke-width="2.5" marker-end="url(#arr-gray)"/>
  <path d="M 770 487 L 720 515" fill="none" stroke="#1C1917" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Bottom Embedding Model -->
  <rect x="640" y="520" width="115" height="54" rx="14" fill="#E76F51"/>
  <text x="697" y="544" class="pill-text" text-anchor="middle">Embedding</text>
  <text x="697" y="560" class="pill-text" text-anchor="middle">Model</text>

  <!-- Right Annotation: Stored in Elastic -->
  <text x="850" y="495" class="annot-text">Both the core</text>
  <text x="850" y="511" class="annot-text">requirements and</text>
  <text x="850" y="527" class="annot-text">the ideal resume</text>
  <text x="850" y="543" class="annot-text">are embedded and</text>
  <text x="850" y="559" class="annot-text">stored in Elastic.</text>
</svg>
