<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="auto">
  <defs>
    <style>
      .main-title { font-family: 'Newsreader', Georgia, serif; font-size: 23px; font-weight: 700; fill: #1C1917; letter-spacing: 0.06em; }
      .sub-title { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 10px; font-weight: 600; fill: #78716C; letter-spacing: 0.12em; }
      .col-header { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11px; font-weight: 700; fill: #2F5D9E; letter-spacing: 0.08em; }
      .node-title { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 11.5px; font-weight: 700; fill: #FFFFFF; letter-spacing: 0.04em; }
      .node-sub { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 9px; fill: rgba(255, 255, 255, 0.9); letter-spacing: 0.02em; }
      .desc-title { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 10px; font-weight: 700; fill: #2F5D9E; letter-spacing: 0.06em; }
      .desc-body { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 8.5px; fill: #57534E; line-height: 1.45; }
      .legend-lbl { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 8px; fill: #78716C; letter-spacing: 0.05em; font-weight: 600; }
      .arrow-lbl { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 8.5px; fill: #78716C; font-weight: 600; }
    </style>
    <marker id="arr-blk" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1C1917"/>
    </marker>
    <marker id="arr-blu" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2F5D9E"/>
    </marker>
    <marker id="arr-crl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E76F51"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FAF6F0" rx="12" stroke="#E6DFD5" stroke-width="2"/>

  <!-- Main Header -->
  <text x="575" y="44" class="main-title" text-anchor="middle">CYBERAGENT · AUTONOMOUS CYBERSECURITY MULTI-AGENT SWARM</text>
  <text x="575" y="64" class="sub-title" text-anchor="middle">AUTOGEN MULTI-AGENT ORCHESTRATION / MITRE CALDERA / EDR TELEMETRY / PURPLE TEAM CI/CD</text>

  <!-- ========================================================
       COLUMN 1: 01 COORDINATION &amp; PLANNING
       ======================================================== -->
  <rect x="40" y="85" width="320" height="470" rx="8" fill="#F4EEE5" stroke="#DCD4C7" stroke-width="1.2"/>
  <text x="55" y="108" class="col-header">01 COORDINATION &amp; PLANNING</text>

  <!-- Node: Operator Ingress (Teal) -->
  <rect x="65" y="125" width="270" height="54" rx="8" fill="#2A9D8F"/>
  <text x="200" y="148" class="node-title" text-anchor="middle">SECURITY OPERATOR / CI/CD</text>
  <text x="200" y="163" class="node-sub" text-anchor="middle">Target environment · Threat profile inputs</text>

  <!-- Arrow down -->
  <line x1="200" y1="179" x2="200" y2="208" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: Coordinator Agent (Blue) -->
  <rect x="65" y="210" width="270" height="54" rx="8" fill="#457B9D"/>
  <text x="200" y="233" class="node-title" text-anchor="middle">COORDINATOR AGENT (AUTOGEN)</text>
  <text x="200" y="248" class="node-sub" text-anchor="middle">Multi-agent conversation loop &amp; task planner</text>

  <!-- Arrow down -->
  <line x1="200" y1="264" x2="200" y2="293" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: Scenario Decomposer (Coral) -->
  <rect x="65" y="295" width="270" height="54" rx="8" fill="#E76F51"/>
  <text x="200" y="318" class="node-title" text-anchor="middle">THREAT DECOMPOSITION</text>
  <text x="200" y="333" class="node-sub" text-anchor="middle">MITRE ATT&amp;CK matrix mapping &amp; payloads</text>

  <!-- Arrow down -->
  <line x1="200" y1="349" x2="200" y2="380" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: Session State (Dark Navy) -->
  <rect x="65" y="385" width="270" height="52" rx="8" fill="#1E293B"/>
  <text x="200" y="408" class="node-title" text-anchor="middle">AUTOGEN CONVERSATION STATE</text>
  <text x="200" y="423" class="node-sub" text-anchor="middle">Shared memory &amp; sub-agent execution context</text>

  <!-- Arrow to Column 2 -->
  <path d="M 335 322 L 390 322 L 390 151 L 435 151" fill="none" stroke="#2F5D9E" stroke-width="2" marker-end="url(#arr-blu)"/>
  <text x="345" y="315" class="arrow-lbl" fill="#2F5D9E">Dispatch</text>

  <!-- ========================================================
       COLUMN 2: 02 SPECIALIST CYBER AGENTS
       ======================================================== -->
  <rect x="385" y="85" width="340" height="470" rx="8" fill="#F4EEE5" stroke="#DCD4C7" stroke-width="1.2"/>
  <text x="400" y="108" class="col-header">02 SPECIALIST CYBER AGENTS</text>

  <!-- Node: Caldera Emulation Agent (Coral) -->
  <rect x="410" y="125" width="290" height="54" rx="8" fill="#E76F51"/>
  <text x="555" y="148" class="node-title" text-anchor="middle">CALDERA EMULATION AGENT</text>
  <text x="555" y="163" class="node-sub" text-anchor="middle">MITRE ATT&amp;CK adversary attack emulation</text>

  <!-- Arrow down -->
  <line x1="555" y1="179" x2="555" y2="208" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: EDR Telemetry Agent (Blue) -->
  <rect x="410" y="210" width="290" height="54" rx="8" fill="#457B9D"/>
  <text x="555" y="233" class="node-title" text-anchor="middle">EDR TELEMETRY AGENT</text>
  <text x="555" y="248" class="node-sub" text-anchor="middle">Live Windows telemetry &amp; EDR bypass evaluation</text>

  <!-- Arrow down -->
  <line x1="555" y1="264" x2="555" y2="293" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: Code &amp; Payload Analyzer (Purple) -->
  <rect x="410" y="295" width="290" height="52" rx="8" fill="#6366F1"/>
  <text x="555" y="318" class="node-title" text-anchor="middle">CODE &amp; PAYLOAD ANALYZER</text>
  <text x="555" y="333" class="node-sub" text-anchor="middle">Static/dynamic inspection · Obfuscation testing</text>

  <!-- Arrow down -->
  <line x1="555" y1="347" x2="555" y2="380" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: Detection Rule Synthesizer (Teal) -->
  <rect x="410" y="385" width="290" height="52" rx="8" fill="#2A9D8F"/>
  <text x="555" y="408" class="node-title" text-anchor="middle">DETECTION RULE SYNTHESIZER</text>
  <text x="555" y="423" class="node-sub" text-anchor="middle">Generates Sigma &amp; YARA threat signatures</text>

  <!-- Arrow to Column 3 -->
  <path d="M 700 152 L 760 152 L 760 152 L 795 152" fill="none" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- ========================================================
       COLUMN 3: 03 DEFENSIVE DETECTION &amp; CI/CD
       ======================================================== -->
  <rect x="750" y="85" width="360" height="470" rx="8" fill="#F4EEE5" stroke="#DCD4C7" stroke-width="1.2"/>
  <text x="765" y="108" class="col-header">03 DEFENSIVE DETECTION &amp; CI/CD</text>

  <!-- Node: Purple Team CI/CD (Amber) -->
  <rect x="775" y="125" width="310" height="52" rx="8" fill="#D97706"/>
  <text x="930" y="148" class="node-title" text-anchor="middle">PURPLE TEAM CI/CD ENGINE</text>
  <text x="930" y="163" class="node-sub" text-anchor="middle">Continuous validation: attacks vs. defenses</text>

  <!-- Arrow down -->
  <line x1="930" y1="177" x2="930" y2="208" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: EDR Verification Gate (Coral) -->
  <rect x="775" y="210" width="310" height="52" rx="8" fill="#E76F51"/>
  <text x="930" y="233" class="node-title" text-anchor="middle">EDR DETECTION EVALUATION</text>
  <text x="930" y="248" class="node-sub" text-anchor="middle">Benchmarking bypass rates across endpoints</text>

  <!-- Arrow down -->
  <line x1="930" y1="262" x2="930" y2="293" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: SIEM / Alert Dispatcher (Teal) -->
  <rect x="775" y="295" width="310" height="54" rx="8" fill="#2A9D8F"/>
  <text x="930" y="318" class="node-title" text-anchor="middle">SIEM &amp; TELEMETRY DISPATCH</text>
  <text x="930" y="333" class="node-sub" text-anchor="middle">Real-time alerts, Splunk, Elastic sync</text>

  <!-- Arrow down -->
  <line x1="930" y1="349" x2="930" y2="380" stroke="#1C1917" stroke-width="2" marker-end="url(#arr-blk)"/>

  <!-- Node: Immutable Forensic Ledger (Dark Navy) -->
  <rect x="775" y="385" width="310" height="52" rx="8" fill="#1E293B"/>
  <text x="930" y="408" class="node-title" text-anchor="middle">FORENSIC AUDIT RECORD</text>
  <text x="930" y="423" class="node-sub" text-anchor="middle">Validated detection signatures &amp; action trace</text>

  <!-- Feedback line back to operator -->
  <path d="M 930 437 L 930 480 L 200 480 L 200 442" fill="none" stroke="#2F5D9E" stroke-width="2" marker-end="url(#arr-blu)"/>
  <text x="565" y="474" class="arrow-lbl" fill="#2F5D9E">Continuous detection hardening loop</text>

  <!-- ========================================================
       BOTTOM DESCRIPTIONS
       ======================================================== -->
  <text x="50" y="580" class="desc-title">COORDINATION &amp; AUTOGEN</text>
  <text x="50" y="596" class="desc-body">AutoGen coordinator orchestrates specialized agents</text>
  <text x="50" y="609" class="desc-body">decomposing high-level threat profiles into granular operations.</text>

  <text x="400" y="580" class="desc-title">SPECIALIST CYBER AGENTS</text>
  <text x="400" y="596" class="desc-body">Dedicated agents handle MITRE Caldera attacks, Windows EDR</text>
  <text x="400" y="609" class="desc-body">telemetry evaluation, and automated Sigma/YARA synthesis.</text>

  <text x="770" y="580" class="desc-title">PURPLE TEAM CI/CD</text>
  <text x="770" y="596" class="desc-body">Always-on purple team validates detection coverage continuously,</text>
  <text x="770" y="609" class="desc-body">closing the gap between adversary techniques and SIEM alerts.</text>

  <!-- ========================================================
       BOTTOM LEGEND
       ======================================================== -->
  <rect x="50" y="640" width="16" height="12" rx="3" fill="#2A9D8F"/>
  <text x="73" y="650" class="legend-lbl">COORDINATION / INGRESS</text>

  <rect x="230" y="640" width="16" height="12" rx="3" fill="#457B9D"/>
  <text x="253" y="650" class="legend-lbl">TELEMETRY &amp; STATE</text>

  <rect x="430" y="640" width="16" height="12" rx="3" fill="#E76F51"/>
  <text x="453" y="650" class="legend-lbl">CALDERA ATTACK EMULATION</text>

  <rect x="630" y="640" width="16" height="12" rx="3" fill="#6366F1"/>
  <text x="653" y="650" class="legend-lbl">PAYLOAD ANALYZER</text>

  <rect x="810" y="640" width="16" height="12" rx="3" fill="#D97706"/>
  <text x="833" y="650" class="legend-lbl">PURPLE TEAM CI/CD</text>

  <text x="1000" y="650" class="legend-lbl">CYBERAGENT</text>
</svg>
